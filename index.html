<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Sell Your Home for Top Dollar | Wil &amp; Liz Team</title>
    <meta
      name="description"
      content="Thinking about selling your Southern California home? Enter your address and the Wil &amp; Liz Team will get back to you with what it's worth."
    />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph: controls how the link previews when shared from an ad or text -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sell Your Home for Top Dollar | Wil & Liz Team" />
    <meta
      property="og:description"
      content="With 75+ years of combined experience, we'll help you sell faster and for top dollar."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Hero photograph is the LCP element — fetch it in parallel with the CSS.
         Keep these two paths in sync with HERO_BACKGROUND in src/config.ts. -->
    <link
      rel="preload"
      as="image"
      href="/hero-home-sm.webp"
      type="image/webp"
      media="(max-width: 899px)"
    />
    <link
      rel="preload"
      as="image"
      href="/hero-home.webp"
      type="image/webp"
      media="(min-width: 900px)"
    />

    <!-- Fonts: two weights only, preconnected, swap so text paints immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Meta Pixel <noscript> fallback. The pixel itself is initialised in
         src/lib/pixel.ts so the ID lives in exactly one configurable place. -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=1711242080023828&ev=PageView&noscript=1"
      />
    </noscript>
  </body>
</html>
